<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>最后的自由 - Linux版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0a0e1a; color: #fff; overflow: hidden; user-select: none; }
canvas#map { display: block; cursor: grab; }
canvas#map:active { cursor: grabbing; }

/* === 高德车机版风格 HUD === */

/* 顶部导航栏 - 深色半透明 */
#top-bar {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 20;
  background: linear-gradient(180deg, rgba(10,14,26,0.92) 0%, rgba(10,14,26,0.7) 100%);
  padding: 10px 20px;
  min-height: 60px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
#road-info-wrap {
  display: flex; flex-direction: column;
  justify-content: center;
  gap: 4px;
}
#road-name {
  font-size: 17px; color: #e8ecf4;
  font-weight: 600;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
#road-location {
  display: inline-flex; align-items: center; gap: 4px;
  color: #64d2ff;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.5px;
  width: fit-content;
}
#road-location::before {
  content: '📍';
  font-size: 10px;
}

/* 圆形速度仪表 */
#speed-gauge {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,180,255,0.15) 0%, rgba(0,100,200,0.05) 70%);
  border: 2px solid rgba(100,210,255,0.4);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 0 20px rgba(0,150,255,0.15), inset 0 0 15px rgba(0,100,200,0.1);
}
#speed-value {
  font-size: 26px; font-weight: 700;
  color: #fff; line-height: 1;
  font-family: 'SF Mono', 'Menlo', monospace;
  font-variant-numeric: tabular-nums;
}
#speed-unit {
  font-size: 10px; color: rgba(100,210,255,0.7);
  font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px;
}

/* 水印信息卡 */
#watermark {
  position: fixed; top: 70px; left: 16px;
  z-index: 20;
  background: rgba(10,14,26,0.8);
  border: 1px solid rgba(100,210,255,0.2);
  border-left: 3px solid #64d2ff;
  padding: 8px 14px;
  border-radius: 6px;
  pointer-events: none;
  line-height: 1.5;
  backdrop-filter: blur(6px);
}
#watermark .wm-title {
  font-size: 13px; font-weight: 700; color: #e8ecf4;
  display: block;
}
#watermark .wm-sub {
  font-size: 10px; color: rgba(100,210,255,0.6);
  display: block;
}
#watermark .wm-bili {
  font-size: 10px; color: rgba(255,255,255,0.35);
  display: block;
  margin-top: 2px;
}

/* 安全提示 */
#warning-box {
  position: fixed; top: 70px; right: 16px;
  z-index: 20;
  background: rgba(10,14,26,0.7);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 4px 12px; border-radius: 20px;
  font-size: 10px; color: rgba(255,255,255,0.4);
  pointer-events: none;
  backdrop-filter: blur(6px);
}

/* 底部字幕 - 车机风格 */
#subtitle-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 20; padding: 0 20px 20px;
  background: linear-gradient(transparent 0%, rgba(10,14,26,0.85) 100%);
  text-align: center;
  pointer-events: none;
}
#subtitle-text {
  font-size: 26px; color: #fff;
  font-weight: 800;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5);
  letter-spacing: 3px;
}

/* 贴纸 */
#sticker-left {
  position: fixed; bottom: 50px; left: 12px;
  z-index: 25; pointer-events: none;
  width: 140px; height: 120px;
  opacity: 0.9;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
}
#sticker-right {
  position: fixed; bottom: 45px; right: 12px;
  z-index: 25; pointer-events: none;
  width: 120px; height: 150px;
  opacity: 0.9;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
}
#sticker-left img, #sticker-right img {
  width: 100%; height: 100%; object-fit: contain;
}

/* LIVE 指示灯 */
#live-indicator {
  position: fixed; top: 80px; left: 16px;
  z-index: 20;
  background: rgba(220, 40, 40, 0.9);
  padding: 3px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 700;
  color: #fff;
  animation: livePulse 2s infinite;
  pointer-events: none;
  letter-spacing: 1px;
  box-shadow: 0 2px 8px rgba(220,40,40,0.4);
}
@keyframes livePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* 游戏结果覆盖层 */
#game-overlay {
  display: none;
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 30;
  text-align: center;
  pointer-events: none;
}
#game-overlay.show { display: block; }
#game-overlay h1 {
  font-size: 52px; font-weight: 800;
  text-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
  animation: overlayPop 0.5s ease-out;
}
@keyframes overlayPop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* 调试面板 */
#debug-toggle {
  position: fixed; bottom: 100px; right: 16px;
  z-index: 25;
  background: rgba(10,14,26,0.7);
  border: 1px solid rgba(100,210,255,0.2);
  color: rgba(100,210,255,0.5); padding: 4px 10px;
  border-radius: 16px; font-size: 10px;
  cursor: pointer;
  backdrop-filter: blur(6px);
}
#debug-toggle:hover { border-color: rgba(100,210,255,0.5); color: #64d2ff; }
#debug-panel {
  display: none;
  position: fixed; top: 70px; right: 10px;
  z-index: 25;
  background: rgba(10,14,26,0.95);
  padding: 14px; border-radius: 12px;
  font-size: 11px; max-width: 280px;
  border: 1px solid rgba(100,210,255,0.15);
  backdrop-filter: blur(10px);
}
#debug-panel.show { display: block; }
#debug-panel label { display: block; margin: 4px 0 2px; color: rgba(100,210,255,0.6); font-size: 10px; }
#debug-panel input, #debug-panel select {
  width: 100%; padding: 6px 8px; margin: 2px 0;
  background: rgba(255,255,255,0.05); color: #e8ecf4; border: 1px solid rgba(100,210,255,0.15);
  border-radius: 6px; font-size: 11px;
}
#debug-panel input:focus, #debug-panel select:focus { border-color: #64d2ff; outline: none; }
#debug-panel button {
  width: 100%; padding: 8px; margin: 4px 0;
  background: rgba(100,210,255,0.1); color: #64d2ff; border: 1px solid rgba(100,210,255,0.2);
  border-radius: 6px; cursor: pointer; font-size: 11px;
}
#debug-panel button:hover { background: rgba(100,210,255,0.2); }
#debug-stats { font-family: 'SF Mono', monospace; color: rgba(100,210,255,0.6); font-size: 10px; margin-top: 8px; }

/* 星级评分 */
#star-rating {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 20; pointer-events: none;
  font-size: 18px;
  background: rgba(10,14,26,0.6);
  padding: 4px 12px; border-radius: 20px;
  backdrop-filter: blur(6px);
}
.star { color: rgba(255,255,255,0.15); text-shadow: none; transition: all 0.3s; }
.star.active { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.6); }
</style>

<!-- Debug toggle -->

<script>
// === CHASE MUSIC ===
const chaseMusic = [
  new Audio('music/cmon.m4a'),
  new Audio('music/she_makes_me_go.m4a')
];
chaseMusic.forEach(m => { m.loop = true; m.volume = 0.7; });
let currentTrack = 0;
let musicPlaying = false;

function startChaseMusic() {
  if (musicPlaying) return;
  currentTrack = 0;
  chaseMusic[currentTrack].play().catch(e => console.log('Audio play failed:', e));
  musicPlaying = true;
  // Switch to next track when current one ends
  chaseMusic.forEach((m, i) => {
    m.onended = () => {
      currentTrack = (i + 1) % chaseMusic.length;
      chaseMusic[currentTrack].play().catch(e => {});
    };
  });
}

function stopChaseMusic() {
  chaseMusic.forEach(m => { m.pause(); m.currentTime = 0; });
  musicPlaying = false;
}

// === ARREST & STAR CLEAR MUSIC ===
const arrestMusic = new Audio('music/arrest_music.m4a');
arrestMusic.volume = 0.8;
const starClearMusic = new Audio('music/star_clear_music.m4a');
starClearMusic.volume = 0.8;

function playArrestMusic() {
  stopChaseMusic();
  arrestMusic.currentTime = 0;
  arrestMusic.play().catch(e => console.log('Arrest audio failed:', e));
}

function playStarClearMusic() {
  stopChaseMusic();
  starClearMusic.currentTime = 0;
  starClearMusic.play().catch(e => console.log('Star clear audio failed:', e));
}

// === STICKER DATA (base64 embedded) ===
const STICKERS = {
  "bear_driver": "sticker/panda_driver_nobg.png",
  "anime_girl": "sticker/anime_girl_nobg.png",
  "anime_girl_variant": "sticker/anime_girl_variant_raw.png",
  "panda_running": "sticker/panda_running_raw.png"
};

// === STICKER ROTATION ===
const stickerSets = [
  { left: 'bear_driver', right: 'anime_girl' },
  { left: 'panda_running', right: 'anime_girl_variant' },
  { left: 'bear_driver', right: 'anime_girl_variant' },
  { left: 'panda_running', right: 'anime_girl' },
];
let currentStickerSet = 0;

function rotateStickers() {
  currentStickerSet = (currentStickerSet + 1) % stickerSets.length;
  const set = stickerSets[currentStickerSet];
  document.getElementById('sticker-left-img').src = STICKERS[set.left] || '';
  document.getElementById('sticker-right-img').src = STICKERS[set.right] || '';
}

// Initialize stickers
(function initStickers() {
  const set = stickerSets[0];
  document.getElementById('sticker-left-img').src = STICKERS[set.left] || '';
  document.getElementById('sticker-right-img').src = STICKERS[set.right] || '';
  // Rotate stickers every 30 seconds
  setInterval(rotateStickers, 30000);
})();

// === CAPTIONS (押韵字幕) ===
const captions = [
  "警灯一开，悠哉悠哉",
  "赶快去拿纸，蹲下就开始",
  "全速怕什么怕",
  "给我闹！",
  "奋力踩踩踩",
  "细妹细狗哦",
  "已然被老哥彻底驯化",
  "是一秒钟都等不了",
  "会打出什么操作来呢",
  "七星大佬不挑车",
  "主打一个看准都不顺眼",
  "感觉良好！塔台塔台，我已起飞",
  "收徒不收坐骑",
  "把大灯和刹车扔家了",
  "和本田思域一同起飞",
];
let captionIndex = 0;

function rotateCaption() {
  captionIndex = (captionIndex + 1) % captions.length;
  document.getElementById('subtitle-text').textContent = captions[captionIndex];
}
setInterval(rotateCaption, 8000);

// === STAR RATING ===
let currentStars = 0;
function setStars(n) {
  currentStars = n;
  for (let i = 1; i <= 7; i++) {
    document.getElementById('star' + i).className = i <= n ? 'star active' : 'star';
  }
}

// === MAP ENGINE (same as before, working) ===
let centerLat = 39.9042, centerLng = 116.4074;
let zoom = 15;
let tileCache = {};
let tileFailCount = {};
let stats = { ok: 0, fail: 0, load: 0 };
let loadingSet = new Set();
let canvas, ctx;
let isDragging = false, lastX = 0, lastY = 0;
let viewW, viewH;

// Coordinate math
function lngToPixelX(lng, z) { return ((lng + 180) / 360) * (1 << z) * 256; }
function latToPixelY(lat, z) {
  const n = 1 << z;
  return ((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1/Math.cos(lat * Math.PI / 180)) / Math.PI) / 2) * n * 256;
}
function pixelXToLng(px, z) { return px / ((1 << z) * 256) * 360 - 180; }
function pixelYToLat(py, z) {
  const n = 1 << z;
  return Math.atan(Math.sinh(Math.PI * (1 - 2 * py / (n * 256)))) * 180 / Math.PI;
}

// URL builder
function buildUrl(x, y, z, layerType, proj, endpoint, key) {
  const server = x % 8;
  const full = `${layerType}_${proj}`;
  if (endpoint === 'wmts') {
    return `https://t${server}.tianditu.gov.cn/${full}/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layerType}&STYLE=default&TILEMATRIXSET=${proj}&FORMAT=tiles&TILEMATRIX=${z}&TILEROW=${y}&TILECOL=${x}&tk=${key}`;
  } else {
    return `https://t${server}.tianditu.gov.cn/DataServer?T=${full}&X=${x}&Y=${y}&L=${z}&tk=${key}`;
  }
}
function getAnnoType(t) { return {img:'cia',vec:'cva',ter:'cta'}[t]||'cia'; }

// Tile loading - direct (WebView intercepts to add UA)
function loadTile(x, y, z, layerType, proj, endpoint, key) {
  const k = `${layerType}/${proj}/${z}/${x}/${y}`;
  if (tileCache[k]) return tileCache[k];
  if (tileFailCount[k] >= 3) return null;
  if (loadingSet.has(k)) return null;
  
  const url = buildUrl(x, y, z, layerType, proj, endpoint, key);
  loadingSet.add(k);
  stats.load++;
  updateStats();
  
  fetch(url)
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.blob(); })
    .then(blob => {
      // Auto-fallback: img_c placeholder is ~4769 bytes at high zoom, switch to img_w
      if (proj === 'c' && z >= 11 && blob.size >= 4500 && blob.size <= 5000 && layerType !== '_fallback') {
        const fallbackUrl = buildUrl(x, y, z, layerType, 'w', endpoint, key);
        loadingSet.delete(k);
        fetch(fallbackUrl)
          .then(r2 => r2.blob())
          .then(b2 => {
            const blobUrl2 = URL.createObjectURL(b2);
            const img2 = new Image();
            img2.onload = () => { tileCache[k] = img2; stats.ok++; stats.load = Math.max(0,stats.load-1); loadingSet.delete(k); updateStats(); render(); URL.revokeObjectURL(blobUrl2); };
            img2.onerror = () => { stats.fail++; stats.load = Math.max(0,stats.load-1); loadingSet.delete(k); updateStats(); render(); };
            img2.src = blobUrl2;
          });
        return;
      }
      const blobUrl = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        tileCache[k] = img;
        tileFailCount[k] = 0;
        stats.ok++; stats.load = Math.max(0, stats.load-1);
        loadingSet.delete(k);
        updateStats(); render();
        URL.revokeObjectURL(blobUrl);
      };
      img.onerror = () => {
        tileFailCount[k] = (tileFailCount[k]||0)+1;
        stats.fail++; stats.load = Math.max(0, stats.load-1);
        loadingSet.delete(k);
        updateStats(); render();
        URL.revokeObjectURL(blobUrl);
      };
      img.src = blobUrl;
    })
    .catch(err => {
      tileFailCount[k] = (tileFailCount[k]||0)+1;
      stats.fail++; stats.load = Math.max(0, stats.load-1);
      loadingSet.delete(k);
      updateStats(); render();
    });
  return null;
}

function updateStats() {
  document.getElementById('debug-stats').textContent = 
    `瓦片: OK=${stats.ok} Fail=${stats.fail} Load=${stats.load}`;
}

// === RENDER ===
function render() {
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, viewW, viewH);
  
  const key = document.getElementById('key-input').value.trim();
  const endpoint = document.getElementById('endpoint').value;
  const layerType = document.getElementById('layer-type').value;
  const proj = document.getElementById('proj').value;
  const annoType = getAnnoType(layerType);
  
  // 航拍视角：地图中心 = 摄像头位置，玩家显示在屏幕偏下
  const playerScreenY = viewH * PLAYER_SCREEN_Y_RATIO;
  const cameraOffsetY = viewH / 2 - playerScreenY; // 地图向上偏移，玩家显示在下方
  const cx = lngToPixelX(centerLng, zoom);
  const cy = latToPixelY(centerLat, zoom);
  const tilesX = Math.ceil(viewW / 256) + 2;
  const tilesY = Math.ceil(viewH / 256) + 2;
  const ctX = Math.floor(cx / 256);
  const ctY = Math.floor(cy / 256);
  const maxTile = 1 << zoom;
  
  // 绘制底图瓦片（偏移渲染，使玩家显示在屏幕偏下）
  for (let dy = -Math.floor(tilesY/2); dy <= Math.floor(tilesY/2); dy++) {
    for (let dx = -Math.floor(tilesX/2); dx <= Math.floor(tilesX/2); dx++) {
      const tx = ctX + dx, ty = ctY + dy;
      if (tx < 0 || ty < 0 || tx >= maxTile || ty >= maxTile) continue;
      const px = tx * 256 - cx + viewW/2;
      const py = ty * 256 - cy + viewH/2 + cameraOffsetY;
      const img = loadTile(tx, ty, zoom, layerType, proj, endpoint, key);
      if (img) ctx.drawImage(img, px, py, 256, 256);
    }
  }
  // 绘制标注瓦片
  for (let dy = -Math.floor(tilesY/2); dy <= Math.floor(tilesY/2); dy++) {
    for (let dx = -Math.floor(tilesX/2); dx <= Math.floor(tilesX/2); dx++) {
      const tx = ctX + dx, ty = ctY + dy;
      if (tx < 0 || ty < 0 || tx >= maxTile || ty >= maxTile) continue;
      const px = tx * 256 - cx + viewW/2;
      const py = ty * 256 - cy + viewH/2 + cameraOffsetY;
      const img = loadTile(tx, ty, zoom, annoType, proj, endpoint, key);
      if (img) ctx.drawImage(img, px, py, 256, 256);
    }
  }
  
  // 绘制危险圈（缩小的红色区域）- 使用偏移坐标
  if (destSet && gameRunning) {
    const destScreenX = lngToPixelX(destLng, zoom) - cx + viewW/2;
    const destScreenY = latToPixelY(destLat, zoom) - cy + viewH/2 + cameraOffsetY;
    const metersPerPixel = 156543.03392 * Math.cos(centerLat * Math.PI / 180) / (1 << zoom);
    const circlePixels = circleRadius / metersPerPixel;
    
    // 圈外红色覆盖
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, viewW, viewH);
    ctx.arc(destScreenX, destScreenY, circlePixels, 0, Math.PI * 2, true);
    ctx.fillStyle = 'rgba(255, 30, 30, 0.12)';
    ctx.fill();
    ctx.restore();
    
    // 圈边缘（渐变发光）
    ctx.beginPath();
    ctx.arc(destScreenX, destScreenY, circlePixels, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 60, 60, 0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    
    // 目标点
    ctx.beginPath();
    ctx.arc(destScreenX, destScreenY, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4444';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(destScreenX, destScreenY, 10, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,68,68,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    // 缩小圈
    const elapsed = (Date.now() - gameStartTime) / 1000;
    circleRadius = circleRadius * (1 - elapsed * 0.001);
    if (circleRadius < 50) {
      gameRunning = false;
      stopChaseMusic();
      playArrestMusic();
      showOverlay('被捕！', '#ff4444');
    }
  }
  
  // === 航拍视角：玩家标记（显示在屏幕偏下位置）===
  const playerX = viewW / 2;
  const playerY = playerScreenY;
  
  // 计算朝向（从当前位置到目标的方位角）
  if (destSet && gameRunning) {
    const dLng = destLng - centerLng;
    const dLat = destLat - centerLat;
    lastHeading = Math.atan2(dLng, dLat) * 180 / Math.PI;
  }
  
  // 航拍跟踪准星 - 简洁风格
  ctx.save();
  ctx.translate(playerX, playerY);
  
  // 外圈（呼吸动画）
  const breathe = 1 + Math.sin(Date.now() / 800) * 0.05;
  const outerR = 35 * breathe;
  ctx.beginPath();
  ctx.arc(0, 0, outerR, 0, Math.PI * 2);
  ctx.strokeStyle = gameRunning ? 'rgba(0,220,100,0.5)' : 'rgba(100,210,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  
  // 内圈
  ctx.beginPath();
  ctx.arc(0, 0, 12, 0, Math.PI * 2);
  ctx.strokeStyle = gameRunning ? 'rgba(0,220,100,0.4)' : 'rgba(100,210,255,0.25)';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  // 十字线（短，不延伸到边缘）
  const crossLen = 18;
  const crossGap = 14;
  ctx.beginPath();
  ctx.moveTo(-crossLen - crossGap, 0); ctx.lineTo(-crossGap, 0);
  ctx.moveTo(crossGap, 0); ctx.lineTo(crossLen + crossGap, 0);
  ctx.moveTo(0, -crossLen - crossGap); ctx.lineTo(0, -crossGap);
  ctx.moveTo(0, crossGap); ctx.lineTo(0, crossLen + crossGap);
  ctx.strokeStyle = gameRunning ? 'rgba(0,220,100,0.5)' : 'rgba(100,210,255,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  // 朝向指示箭头（小三角形指向前进方向）
  if (gameRunning && destSet) {
    ctx.save();
    ctx.rotate((lastHeading) * Math.PI / 180);
    ctx.beginPath();
    ctx.moveTo(0, -outerR - 8);
    ctx.lineTo(-5, -outerR - 2);
    ctx.lineTo(5, -outerR - 2);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,220,100,0.6)';
    ctx.fill();
    ctx.restore();
  }
  
  // 高度和方位信息
  ctx.font = '10px "SF Mono", monospace';
  ctx.fillStyle = 'rgba(100,210,255,0.5)';
  ctx.textAlign = 'left';
  ctx.fillText(`ALT ${helicopterAltitude}m`, outerR + 8, -4);
  ctx.fillText(`HDG ${Math.round((lastHeading + 360) % 360)}°`, outerR + 8, 10);
  
  ctx.restore();
  
  // Signal loss visual effect
  if (signalLost && gameRunning) {
    // Static noise overlay
    ctx.save();
    ctx.globalAlpha = 0.08 + Math.random() * 0.05;
    for (let i = 0; i < 200; i++) {
      const sx = Math.random() * viewW;
      const sy = Math.random() * viewH;
      const sw = 2 + Math.random() * 4;
      const sh = 1;
      ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#000';
      ctx.fillRect(sx, sy, sw, sh);
    }
    ctx.restore();
    
    // "NO SIGNAL" text at top
    ctx.save();
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = signalFlickerTimer % 2 === 0 ? '#ff4444' : '#880000';
    ctx.textAlign = 'center';
    ctx.fillText('▶ NO SIGNAL - SEARCHING...', viewW/2, 30);
    ctx.restore();
  }
}

// === INTERACTION ===
function initCanvas() {
  canvas = document.getElementById('map');
  ctx = canvas.getContext('2d');
  viewW = window.innerWidth;
  viewH = window.innerHeight;
  canvas.width = viewW;
  canvas.height = viewH;
  
  canvas.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
  canvas.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    centerLng = pixelXToLng(lngToPixelX(centerLng, zoom) - dx, zoom);
    centerLat = pixelYToLat(latToPixelY(centerLat, zoom) - dy, zoom);
    lastX = e.clientX; lastY = e.clientY;
    render();
  });
  canvas.addEventListener('mouseup', () => isDragging = false);
  canvas.addEventListener('mouseleave', () => isDragging = false);
  
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.deltaY < 0 && zoom < 18) zoom++;
    else if (e.deltaY > 0 && zoom > 1) zoom--;
    document.getElementById('zoom-range').value = zoom;
    document.getElementById('zoom-label').textContent = zoom;
    tileCache = {}; stats = {ok:0,fail:0,load:0};
    render();
  });
  
  // 双击打开目的地选择器（高德风格）
  canvas.addEventListener('dblclick', e => {
    if (!gameRunning) {
      showDestPicker();
    }
  });
  
  window.addEventListener('resize', () => {
    viewW = window.innerWidth; viewH = window.innerHeight;
    canvas.width = viewW; canvas.height = viewH;
    render();
  });
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

  zoom = parseInt(document.getElementById('zoom-range').value);
  tileCache = {}; tileFailCount = {}; stats = {ok:0,fail:0,load:0};
  render();
}
function testSingleTile() {
  const key = document.getElementById('key-input').value.trim();
  const endpoint = document.getElementById('endpoint').value;
  const layerType = document.getElementById('layer-type').value;
  const proj = document.getElementById('proj').value;
  const n = 1 << zoom;
  const tx = Math.floor((centerLng+180)/360*n);
  const ty = Math.floor(latToPixelY(centerLat,zoom)/256);
  const url = buildUrl(tx, ty, zoom, layerType, proj, endpoint, key);
  fetch(url)
    .then(r => { alert(`HTTP ${r.status}, type=${r.headers.get('content-type')}`); return r.blob(); })
    .then(b => alert(`Size: ${b.size} bytes`))
    .catch(e => alert(`Error: ${e.message}`));
}

document.getElementById('zoom-range').addEventListener('input', e => {
  document.getElementById('zoom-label').textContent = e.target.value;
});

// === INIT ===
initCanvas();
render();

// 自动弹出目的地选择器
setTimeout(() => showDestPicker(), 1500);

// Animation loop for game state
function gameLoop() {
  if (gameRunning) {
    // Move player toward destination
    const dx = destLng - centerLng;
    const dy = destLat - centerLat;
    const speedFactor = gameSpeed * 0.0000002; // Convert MPH to degrees/sec
    centerLng += dx * speedFactor;
    centerLat += dy * speedFactor;
    
    // 航拍视角：摄像头跟随玩家
    if (aerialMode && !signalLost) {
      cameraLat = centerLat;
      cameraLng = centerLng;
    }
    
    // Signal loss detection
    const distFromLastKnown = haversine(centerLat, centerLng, lastKnownLat, lastKnownLng);
    if (lastSignalTime === 0) {
      // Initialize
      lastKnownLat = centerLat;
      lastKnownLng = centerLng;
      lastSignalTime = Date.now();
    }
    
    // Simulate periodic signal availability (GPS-like)
    // Signal is "available" when speed > 20 MPH and distance from last known < 2km
    const signalAvailable = gameSpeed > 20 && distFromLastKnown < 2000;
    
    if (signalAvailable) {
      lastKnownLat = centerLat;
      lastKnownLng = centerLng;
      lastSignalTime = Date.now();
      if (signalLost) {
        signalLost = false;
        signalLostZooming = false;
        zoom = originalZoom;
        document.getElementById('signal-loss-indicator').style.display = 'none';
        showOverlay('信号恢复', '#00ff00');
      }
    } else if (!signalLost && Date.now() - lastSignalTime > 5000) {
      // Signal lost after 5 seconds without GPS fix
      signalLost = true;
      signalLostTime = Date.now();
      originalZoom = zoom;
      signalLostZooming = true;
      signalLostZoomStart = Date.now();
      document.getElementById('signal-loss-indicator').style.display = 'block';
    }
    
    // Signal loss behavior: zoom out gradually
    if (signalLost) {
      signalFlickerTimer = Math.floor(Date.now() / 500);
      
      const timeSinceLost = Date.now() - signalLostTime;
      
      // Update timer display
      const remaining = Math.max(0, Math.ceil((SIGNAL_LOSS_TIMEOUT - timeSinceLost) / 1000));
      document.getElementById('signal-timer').textContent = remaining + 's';
      
      // Gradually zoom out
      const zoomOutProgress = Math.min(1, timeSinceLost / (SIGNAL_LOSS_TIMEOUT * 0.8));
      const targetZoom = Math.max(3, originalZoom - Math.floor(zoomOutProgress * 8));
      if (targetZoom !== zoom) {
        zoom = targetZoom;
        tileCache = {};
      }
      
      // After 60 seconds: 消星成功
      if (timeSinceLost >= SIGNAL_LOSS_TIMEOUT) {
        gameRunning = false;
        signalLost = false;
        stopChaseMusic();
        playStarClearMusic();
        document.getElementById('signal-loss-indicator').style.display = 'none';
        showOverlay('★ 消星成功 ★\n目标丢失60秒', '#00ff00');
        setStars(0);
      }
    }
    
    // Check if reached destination (normal win condition)
    const dist = haversine(centerLat, centerLng, destLat, destLng);
    if (dist < 100 && !signalLost) { // Within 100m and signal OK
      gameRunning = false;
      stopChaseMusic();
      playStarClearMusic();
      showOverlay('★ 消星成功 ★', '#00ff00');
      setStars(0);
    }
    
    // 航拍视角：更新中心位置
    if (aerialMode) {
      centerLat = cameraLat;
      centerLng = cameraLng;
    }
    
    render();
  }
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
